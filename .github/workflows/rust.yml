name: Rust

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'docs/**'
      - 'METHODOLOGY.md'
      - 'scripts/build-site.sh'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'docs/**'
      - 'METHODOLOGY.md'
      - 'scripts/build-site.sh'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Check formatting
      run: cargo fmt --check
